name: Relais IA

# Déploie le relais IA sur Cloudflare à chaque modification de relais/,
# puis branche le site sur l'adresse du relais (config.js).
# Dans une copie de GERI (perso/relais.json présent, voir PARTAGER.md), les réglages de la copie
# remplacent ceux de l'original le temps du déploiement, et l'adresse va dans perso/site.js.
on:
  push:
    branches: [main]
    paths: ['relais/**', '.github/workflows/relais.yml', 'perso/relais.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relais-ia
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IA_CLE: ${{ secrets.IA_CLE }}
      NOTION_CLE: ${{ secrets.NOTION_CLE }}
      PAYHIP_CLE: ${{ secrets.PAYHIP_CLE }}
      PLAUSIBLE_CLE: ${{ secrets.PLAUSIBLE_CLE }}
      # GitHub refuse les noms de secrets en GITHUB_… : le secret s'appelle GH_LECTURE,
      # et devient GITHUB_LECTURE dans le relais (Cloudflare n'a pas cette règle).
      GH_LECTURE: ${{ secrets.GH_LECTURE }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tests du relais
        working-directory: relais
        run: npm test

      - name: Réglages de cette copie (perso/relais.json)
        id: copie
        run: |
          if [ -f perso/relais.json ]; then
            node outils/appliquer-perso.mjs perso/relais.json relais/wrangler.toml
            echo "cible=perso/site.js" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REPOSITORY_OWNER,,}" = "ouzgane" ]; then
            # Instance d'origine : réglages de relais/wrangler.toml, adresse du relais dans config.js.
            echo "cible=config.js" >> "$GITHUB_OUTPUT"
          else
            # Copie pas encore installée : ne jamais déployer les réglages de l'original.
            echo "cible=" >> "$GITHUB_OUTPUT"
          fi

      - name: Secrets Cloudflare présents ?
        id: verif
        env:
          CIBLE: ${{ steps.copie.outputs.cible }}
        run: |
          if [ -z "$CIBLE" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cette copie de GERI n'est pas encore installée : lance d'abord Actions → Installer GERI (voir PARTAGER.md). Il déploiera ensuite le relais."
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "pret=true" >> "$GITHUB_OUTPUT"
          else
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoute les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions), puis relance ce workflow."
          fi

      - name: Déployer sur Cloudflare
        id: deploy
        if: steps.verif.outputs.pret == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relais
          command: deploy

      - name: Clé du fournisseur (seulement hors Cloudflare)
        if: steps.verif.outputs.pret == 'true' && env.IA_CLE != ''
        working-directory: relais
        run: printf '%s' "$IA_CLE" | npx --yes wrangler@4 secret put IA_CLE

      - name: Clé Notion (pour les mises à jour confirmées par Geri)
        if: steps.verif.outputs.pret == 'true' && env.NOTION_CLE != ''
        working-directory: relais
        run: printf '%s' "$NOTION_CLE" | npx --yes wrangler@4 secret put NOTION_CLE

      # Connexions du pilotage : chaque clé est facultative ; sans elle, la connexion reste éteinte.
      - name: Clé Payhip (signature des ventes reçues)
        if: steps.verif.outputs.pret == 'true' && env.PAYHIP_CLE != ''
        working-directory: relais
        run: printf '%s' "$PAYHIP_CLE" | npx --yes wrangler@4 secret put PAYHIP_CLE

      - name: Clé Plausible (relevé de l'audience, lecture seule)
        if: steps.verif.outputs.pret == 'true' && env.PLAUSIBLE_CLE != ''
        working-directory: relais
        run: printf '%s' "$PLAUSIBLE_CLE" | npx --yes wrangler@4 secret put PLAUSIBLE_CLE

      - name: Jeton GitHub en lecture (suivi des dépôts des projets)
        if: steps.verif.outputs.pret == 'true' && env.GH_LECTURE != ''
        working-directory: relais
        run: printf '%s' "$GH_LECTURE" | npx --yes wrangler@4 secret put GITHUB_LECTURE

      - name: Brancher le site sur le relais
        if: steps.verif.outputs.pret == 'true'
        env:
          URL_DEPLOYEE: ${{ steps.deploy.outputs.deployment-url }}
          SORTIE: ${{ steps.deploy.outputs.command-output }}
          CIBLE: ${{ steps.copie.outputs.cible }}
        run: |
          URL="${URL_DEPLOYEE:-$(printf '%s' "$SORTIE" | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)}"
          URL="${URL%/}"
          if [ -z "$URL" ]; then
            echo "::warning::Adresse du relais introuvable dans la sortie de wrangler : renseigne-la à la main dans config.js."
            exit 0
          fi
          echo "Relais : $URL"
          curl -fsS --max-time 20 "$URL/" || echo "::notice::Le relais ne répond pas encore (propagation workers.dev, quelques minutes)."
          CIBLE="${CIBLE:-config.js}"
          sed -i -E "s#^([[:space:]]*relais:[[:space:]]*)'[^']*'#\1'${URL}'#" "$CIBLE"
          if git diff --quiet -- "$CIBLE"; then echo "$CIBLE déjà à jour."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$CIBLE"
          git commit -m "Assistant : branchement sur le relais ${URL}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
